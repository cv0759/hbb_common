name: Add fixed password to HARD_SETTINGS
on:
  workflow_dispatch:

jobs:
  add-password:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom-v2
        uses: actions/checkout@v4
        with:
          ref: custom-v2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add fixed password with Python
        run: |
          cat > add_pass.py << 'PYEOF'
import re
with open('src/config.rs', 'r') as f:
    content = f.read()

pattern = r'(\s*)pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = Default::default\(\);'
replacement = r'''\1pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = {
\1        let mut m = HashMap::new();
\1        m.insert("password".to_string(), "0198d738abd01713fc6497c05c62c09f5bf487907d4f8b20124fba83a447cee033".to_string());
\1        RwLock::new(m)
\1    };'''

content = re.sub(pattern, replacement, content, count=1)

with open('src/config.rs', 'w') as f:
    f.write(content)
          PYEOF
          
          python3 add_pass.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config.rs
          git commit -m "Add fixed password to HARD_SETTINGS"
          git push origin custom-v2
          


