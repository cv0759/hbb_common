name: Add all custom settings

on:
  workflow_dispatch:

jobs:
  add-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: custom-v2

      - name: Modify config.rs
        run: |
          python3 << 'EOF'
          import re

          with open('src/config.rs', 'r') as f:
              content = f.read()

          # 修改 HARD_SETTINGS
          hard_settings = '''pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = {
              let mut m = HashMap::new();
              m.insert("permanent-password".to_string(), "0198d738abd01713fc6497c05c62c09f5bf487907d4f8b20124fba83a447cee033".to_string());
              m.insert("disable-settings".to_string(), "Y".to_string());
              m.insert("disable-account".to_string(), "Y".to_string());
              m.insert("disable-installation".to_string(), "Y".to_string());
              m.insert("disable-address-book".to_string(), "Y".to_string());
              RwLock::new(m)
          };'''

          content = re.sub(
              r'pub static ref HARD_SETTINGS: RwLock<HashMap<String, String>> = Default::default\(\);',
              hard_settings,
              content
          )

          # 修改 BUILTIN_SETTINGS
          builtin_settings = '''pub static ref BUILTIN_SETTINGS: RwLock<HashMap<String, String>> = {
              let mut m = HashMap::new();
              m.insert("hide-tray".to_string(), "Y".to_string());
              m.insert("hide-security-settings".to_string(), "Y".to_string());
              m.insert("hide-network-settings".to_string(), "Y".to_string());
              m.insert("hide-display-settings".to_string(), "Y".to_string());
              m.insert("hide-audio-settings".to_string(), "Y".to_string());
              m.insert("hide-file-transfer-settings".to_string(), "Y".to_string());
              m.insert("hide-record-session-settings".to_string(), "Y".to_string());
              m.insert("disable-change-permanent-password".to_string(), "Y".to_string());
              m.insert("disable-change-id".to_string(), "Y".to_string());
              m.insert("disable-unlock-pin".to_string(), "Y".to_string());
              m.insert("hide-help-cards".to_string(), "Y".to_string());
              m.insert("remove-preset-password-warning".to_string(), "Y".to_string());
              RwLock::new(m)
          };'''

          content = re.sub(
              r'pub static ref BUILTIN_SETTINGS: RwLock<HashMap<String, String>> = Default::default\(\);',
              builtin_settings,
              content
          )

          # 修改 OVERWRITE_SETTINGS
          overwrite_settings = '''pub static ref OVERWRITE_SETTINGS: RwLock<HashMap<String, String>> = {
              let mut m = HashMap::new();
              m.insert("enable-file-transfer".to_string(), "N".to_string());
              m.insert("enable-audio".to_string(), "N".to_string());
              m.insert("enable-camera".to_string(), "N".to_string());
              m.insert("enable-terminal".to_string(), "N".to_string());
              m.insert("enable-remote-printer".to_string(), "N".to_string());
              m.insert("enable-tunnel".to_string(), "N".to_string());
              m.insert("enable-remote-restart".to_string(), "N".to_string());
              m.insert("enable-record-session".to_string(), "N".to_string());
              m.insert("enable-block-input".to_string(), "N".to_string());
              m.insert("allow-remove-wallpaper".to_string(), "Y".to_string());
              m.insert("enable-lan-discovery".to_string(), "N".to_string());
              m.insert("approve-mode".to_string(), "password".to_string());
              m.insert("enable-auto-update".to_string(), "N".to_string());
              RwLock::new(m)
          };'''

          content = re.sub(
              r'pub static ref OVERWRITE_SETTINGS: RwLock<HashMap<String, String>> = Default::default\(\);',
              overwrite_settings,
              content
          )

          # 修改 OVERWRITE_DISPLAY_SETTINGS
          overwrite_display_settings = '''pub static ref OVERWRITE_DISPLAY_SETTINGS: RwLock<HashMap<String, String>> = {
              let mut m = HashMap::new();
              m.insert("enable-privacy-mode".to_string(), "Y".to_string());
              RwLock::new(m)
          };'''

          content = re.sub(
              r'pub static ref OVERWRITE_DISPLAY_SETTINGS: RwLock<HashMap<String, String>> = Default::default\(\);',
              overwrite_display_settings,
              content
          )

          with open('src/config.rs', 'w') as f:
              f.write(content)

          print("config.rs modified successfully")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/config.rs
          git commit -m "Add all custom settings"
          git push origin custom-v2
