name: Fix password to plaintext
on:
  workflow_dispatch:

jobs:
  fix-password:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: custom-full
          fetch-depth: 0

      - name: Fix password to plaintext
        run: |
          python3 << 'EOF'
          with open('src/config.rs', 'r', encoding='utf-8') as f:
              lines = f.readlines()
          
          new_lines = []
          in_hard_settings = False
          found_password = False
          
          for line in lines:
              if 'HARD_SETTINGS' in line and 'lazy_static' not in line:
                  in_hard_settings = True
                  new_lines.append(line)
                  continue
              
              if in_hard_settings and 'password' in line and 'insert' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  new_lines.append(f'{indent}m.insert("password".to_string(), "Aa123456.".to_string());\n')
                  found_password = True
                  continue
              
              if in_hard_settings and 'salt' in line and 'insert' in line:
                  continue
              
              if in_hard_settings and 'RwLock::new(m)' in line:
                  in_hard_settings = False
                  new_lines.append(line)
                  continue
              
              new_lines.append(line)
          
          with open('src/config.rs', 'w', encoding='utf-8') as f:
              f.writelines(new_lines)
          
          print("Password fixed to plaintext!")
          print(f"Found password line: {found_password}")
          EOF

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/config.rs
          git commit -m "Fix password to plaintext"
          git push origin custom-full
